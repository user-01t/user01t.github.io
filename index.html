<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#f7efe3" />
<title>生日快乐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     生日贺卡 · 可替换内容区（改这里就够了）
     要改名字 / 祝福语 / 落款，搜索 "EDIT" 标记
     ============================================================ */
  :root{
    --cream:      #f7efe3;
    --cream-deep: #efe2d0;
    --paper:      #fffdf8;
    --ink:        #4a3f36;
    --ink-soft:   #7a6a5c;
    --blush:      #e8a598;
    --blush-deep: #d98878;
    --gold:       #c9a227;
    --line:       #ded0bc;
    --shadow:     0 18px 40px -18px rgba(74,63,54,.28);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family:"Noto Serif SC", "Songti SC", serif;
    color:var(--ink);
    background-color:#efe2d0;
    background-image:
      radial-gradient(120% 80% at 50% 0%, #fffaf3 0%, #f7efe3 45%, #efe2d0 100%);
    background-repeat:no-repeat;
    background-size:100% 100vh;
    overflow-x:hidden;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  /* 纸张纹理：极淡的噪点，让奶油底不显得塑料 */
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    opacity:.5;
    z-index:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.055'/></svg>");
  }

  /* ---------- 星光 / 花瓣画布 ---------- */
  #petals{
    position:fixed; inset:0; z-index:1; pointer-events:none;
  }

  /* ============================================================
     第一屏：封面 + 下拉提示
     ============================================================ */
  .stage{
    position:relative; z-index:2;
    min-height:100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:env(safe-area-inset-top,0) 24px 40px;
    text-align:center;
  }

  .kicker{
    font-size:12px; letter-spacing:.42em; text-indent:.42em;
    color:var(--blush-deep); text-transform:uppercase;
    margin-bottom:22px;
    font-family:"Noto Serif SC", serif;
    opacity:0;
    animation:fadeUp .9s .15s ease forwards;
  }

  .name{
    font-family:"Ma Shan Zheng","Noto Serif SC",serif;
    font-size:clamp(46px, 15vw, 78px);
    line-height:1.15;
    margin:0 0 6px;
    color:var(--ink);
    letter-spacing:.02em;
    opacity:0;
    animation:fadeUp .9s .3s ease forwards;
  }
  .name .hl{
    position:relative; display:inline-block;
    color:var(--blush-deep);
  }
  /* 名字底下手绘感的小波浪 */
  .name .hl::after{
    content:"";
    position:absolute; left:-2%; right:-2%; bottom:.06em; height:.16em;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 12' preserveAspectRatio='none'><path d='M2 8 Q 30 2 55 7 T 105 7 T 155 7 T 198 6' stroke='%23e8a598' stroke-width='4' fill='none' stroke-linecap='round'/></svg>") no-repeat center/100% 100%;
    opacity:.75;
  }

  .sub{
    font-size:clamp(13px,3.6vw,15px);
    color:var(--ink-soft);
    letter-spacing:.16em;
    margin:0 0 44px;
    font-weight:300;
    opacity:0;
    animation:fadeUp .9s .45s ease forwards;
  }

  /* 封面蛋糕：内联 SVG，避免 emoji 字体缺失 */
  .cake{
    display:block;
    width:clamp(120px,34vw,168px);
    margin:0 auto 18px;
    filter:drop-shadow(0 14px 18px rgba(217,136,120,.3));
    animation:bob 3.4s ease-in-out infinite;
  }
  .cake svg{ width:100%; height:auto; display:block; }
  @keyframes bob{
    0%,100%{ transform:translateY(0) rotate(-2deg); }
    50%    { transform:translateY(-9px) rotate(2deg); }
  }

  /* 下拉引导箭头 */
  .pull-hint{
    position:absolute; left:0; right:0; bottom:calc(30px + env(safe-area-inset-bottom,0));
    display:flex; flex-direction:column; align-items:center; gap:8px;
    font-size:12.5px; letter-spacing:.2em; color:var(--ink-soft);
    opacity:0;
    animation:fadeUp .9s .8s ease forwards;
    transition:opacity .4s ease;
  }
  .pull-hint .arrow{
    width:20px; height:20px;
    border-left:1.6px solid var(--blush-deep);
    border-bottom:1.6px solid var(--blush-deep);
    transform:rotate(-45deg);
    animation:arrowNudge 1.8s ease-in-out infinite;
  }
  @keyframes arrowNudge{
    0%,100%{ transform:rotate(-45deg) translate(0,0); opacity:.55; }
    50%    { transform:rotate(-45deg) translate(-4px,4px); opacity:1; }
  }
  .pull-hint.hide{ opacity:0 !important; }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(16px); }
    to  { opacity:1; transform:translateY(0); }
  }

  /* ============================================================
     第二屏：信纸（滚动进入 + 卷轴拉开）
     ============================================================ */
  .letter-wrap{
    position:relative; z-index:2;
    padding:24px 20px calc(60px + env(safe-area-inset-bottom,0));
    display:flex; justify-content:center;
  }

  .letter{
    position:relative;
    width:100%; max-width:430px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:4px 4px 10px 10px;
    padding:38px 28px 34px;
    box-shadow:var(--shadow);
    /* 顶部封条：一开始只露出一小条，滚动后拉开 */
    clip-path:inset(0 0 100% 0);
    transition:clip-path 1.15s cubic-bezier(.2,.75,.25,1);
  }
  .letter.open{ clip-path:inset(0 0 0% 0); }

  /* 信纸四角小圆点装饰 */
  .letter::before,
  .letter::after{
    content:"";
    position:absolute; width:6px; height:6px; border-radius:50%;
    background:var(--blush); opacity:.6;
  }
  .letter::before{ top:14px; left:14px; }
  .letter::after { top:14px; right:14px; box-shadow:0 0 0 0 transparent; }

  /* 顶部烫金细线 */
  .letter .rule{
    height:1px; background:linear-gradient(90deg,transparent,var(--line) 20%,var(--line) 80%,transparent);
    margin:0 0 26px;
  }

  .letter h2{
    font-family:"Ma Shan Zheng",serif;
    font-size:26px; font-weight:400;
    margin:0 0 18px;
    letter-spacing:.04em;
    color:var(--ink);
  }

  .letter p{
    font-size:15px;
    line-height:2.05;
    color:var(--ink-soft);
    margin:0 0 15px;
    letter-spacing:.03em;
    text-align:justify;
  }
  .letter p:last-of-type{ margin-bottom:0; }

  .sign{
    margin-top:30px;
    text-align:right;
    font-family:"Ma Shan Zheng",serif;
    font-size:19px;
    color:var(--blush-deep);
    letter-spacing:.06em;
  }
  .sign small{
    display:block;
    font-family:"Noto Serif SC",serif;
    font-size:11.5px;
    letter-spacing:.24em;
    color:var(--line);
    margin-top:6px;
    filter:brightness(.78);
  }

  /* ============================================================
     第三屏：吹蜡烛互动
     ============================================================ */
  .candle-stage{
    position:relative; z-index:2;
    max-width:430px; margin:0 auto;
    padding:10px 24px calc(80px + env(safe-area-inset-bottom,0));
    text-align:center;
  }
  .candle-title{
    font-size:12.5px; letter-spacing:.3em; color:var(--ink-soft);
    margin:0 0 26px;
    opacity:.9;
  }

  .cake-box{
    position:relative;
    width:190px; height:208px;
    margin:0 auto 24px;
    cursor:pointer;
    -webkit-user-select:none; user-select:none;
  }
  /* 蛋糕体：纯 CSS 分层 */
  .tier{
    position:absolute; left:50%; transform:translateX(-50%);
    border-radius:6px;
    box-shadow:inset 0 -8px 0 rgba(0,0,0,.035);
  }
  .tier-1{ bottom:0;    width:186px; height:64px; background:linear-gradient(180deg,#f6dcc9,#edc4ac); }
  .tier-2{ bottom:64px; width:142px; height:54px; background:linear-gradient(180deg,#fbe8da,#f3d2be); }
  /* 奶油层 */
  .frost{
    position:absolute; left:50%; transform:translateX(-50%);
    height:14px; border-radius:8px;
    background:#fffaf2;
    box-shadow:0 2px 0 rgba(232,165,152,.35);
  }
  .frost-1{ bottom:56px; width:190px; }
  .frost-2{ bottom:114px; width:146px; }
  /* 蜡烛 */
  .candle{
    position:absolute; bottom:118px; left:50%; transform:translateX(-50%);
    width:11px; height:52px; border-radius:4px;
    background:repeating-linear-gradient(135deg,#f3b6c2 0 5px,#fff6f2 5px 10px);
    box-shadow:0 0 0 1px rgba(0,0,0,.03);
  }
  .wick{
    position:absolute; top:-5px; left:50%; transform:translateX(-50%);
    width:2px; height:6px; background:#5b4a3f; border-radius:1px;
  }
  /* 火焰 */
  .flame{
    position:absolute; bottom:52px; left:50%;
    width:16px; height:26px;
    transform:translateX(-50%);
    border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;
    background:radial-gradient(circle at 50% 72%, #fff8d8 0%, #ffd45e 42%, #ff9d3d 72%, #ff7a35 100%);
    box-shadow:0 0 22px 8px rgba(255,178,80,.5), 0 0 46px 20px rgba(255,196,120,.22);
    transform-origin:50% 100%;
    animation:flicker 1.1s ease-in-out infinite;
    transition:opacity .5s ease, transform .5s ease;
  }
  @keyframes flicker{
    0%,100%{ transform:translateX(-50%) scale(1) rotate(-1.5deg); }
    35%    { transform:translateX(-50%) scale(.94,1.07) rotate(2deg); }
    70%    { transform:translateX(-50%) scale(1.04,.95) rotate(-2deg); }
  }
  body.blown .flame{ opacity:0; transform:translateX(-50%) scale(.2) translateY(6px); }

  /* 烟 */
  .smoke{
    position:absolute; bottom:56px; left:50%;
    width:8px; height:8px; border-radius:50%;
    background:rgba(160,150,140,.5);
    opacity:0; pointer-events:none;
  }
  body.blown .smoke{ animation:smokeUp 1.8s ease-out forwards; }
  @keyframes smokeUp{
    0%  { opacity:.55; transform:translate(-50%,0) scale(.6); }
    100%{ opacity:0;   transform:translate(-50%,-70px) scale(2.6); }
  }

  .wish{
    font-family:"Ma Shan Zheng",serif;
    font-size:22px;
    color:var(--blush-deep);
    letter-spacing:.06em;
    min-height:34px;
    margin:0 0 8px;
    opacity:0;
    transform:translateY(10px);
    transition:opacity .7s ease, transform .7s ease;
  }
  .wish.show{ opacity:1; transform:translateY(0); }
  .wish-tip{
    font-size:12.5px; letter-spacing:.18em; color:var(--ink-soft);
    margin:0; opacity:.85;
  }

  /* ---------- 页脚 ---------- */
  .footer{
    position:relative; z-index:2;
    text-align:center;
    font-size:11px; letter-spacing:.3em;
    color:#c3b3a2;
    padding:0 0 calc(34px + env(safe-area-inset-bottom,0));
  }

  /* ---------- 音乐按钮 ---------- */
  .music-btn{
    position:fixed;
    right:16px; top:calc(16px + env(safe-area-inset-top,0));
    z-index:20;
    width:40px; height:40px;
    border-radius:50%;
    border:1px solid rgba(217,136,120,.35);
    background:rgba(255,253,248,.82);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 14px -6px rgba(74,63,54,.3);
    transition:transform .25s ease;
  }
  .music-btn:active{ transform:scale(.92); }
  .music-btn svg{ width:18px; height:18px; fill:var(--blush-deep); }
  .music-btn .off-line{
    position:absolute; width:24px; height:1.5px; background:var(--blush-deep);
    transform:rotate(-45deg); border-radius:2px;
    transition:opacity .25s ease;
  }
  body.music-on .music-btn .off-line{ opacity:0; }
  /* 播放时轻微脉动 */
  body.music-on .music-btn{ animation:btnPulse 2.6s ease-in-out infinite; }
  @keyframes btnPulse{
    0%,100%{ box-shadow:0 4px 14px -6px rgba(74,63,54,.3), 0 0 0 0 rgba(217,136,120,.35); }
    50%    { box-shadow:0 4px 14px -6px rgba(74,63,54,.3), 0 0 0 8px rgba(217,136,120,0); }
  }

  /* ---------- 无障碍 / 减弱动效 ---------- */
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.15s !important; }
    .letter{ clip-path:inset(0 0 0% 0); }
  }
</style>
</head>
<body>

<canvas id="petals"></canvas>

<button class="music-btn" id="musicBtn" aria-label="开关背景音乐">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
  </svg>
  <span class="off-line"></span>
</button>

<!-- ========== 第一屏 ========== -->
<section class="stage">
  <span class="cake" aria-hidden="true">
    <svg viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg">
      <!-- 火焰 -->
      <g class="svg-flame">
        <ellipse cx="60" cy="14" rx="5.5" ry="9" fill="#ffd45e"/>
        <ellipse cx="60" cy="16.5" rx="2.8" ry="5" fill="#fff8d8"/>
      </g>
      <!-- 蜡烛 -->
      <rect x="56.5" y="24" width="7" height="18" rx="2.5" fill="#f3b6c2"/>
      <rect x="56.5" y="24" width="3.5" height="18" rx="2" fill="#fff6f2" opacity=".65"/>
      <!-- 上层 -->
      <rect x="30" y="42" width="60" height="24" rx="4" fill="#f6dcc9"/>
      <path d="M28 44 q4 -7 8 0 q4 -7 8 0 q4 -7 8 0 q4 -7 8 0 q4 -7 8 0 q4 -7 8 0 q4 -7 8 0 v6 h-64 z" fill="#fffaf2"/>
      <!-- 下层 -->
      <rect x="16" y="66" width="88" height="30" rx="5" fill="#edc4ac"/>
      <path d="M14 68 q5 -8 10 0 q5 -8 10 0 q5 -8 10 0 q5 -8 10 0 q5 -8 10 0 q5 -8 10 0 q5 -8 10 0 q5 -8 10 0 v7 h-90 z" fill="#fffaf2"/>
      <!-- 樱桃点缀 -->
      <circle cx="34" cy="41" r="3" fill="#e8837a"/>
      <circle cx="60" cy="41" r="3" fill="#e8837a"/>
      <circle cx="86" cy="41" r="3" fill="#e8837a"/>
      <circle cx="28" cy="65" r="3.4" fill="#e8a598"/>
      <circle cx="60" cy="65" r="3.4" fill="#e8a598"/>
      <circle cx="92" cy="65" r="3.4" fill="#e8a598"/>
      <!-- 托盘 -->
      <rect x="10" y="96" width="100" height="5" rx="2.5" fill="#d98878" opacity=".85"/>
    </svg>
  </span>
  <p class="kicker">Happy Birthday</p>
  <!-- EDIT：把「小满」换成收卡人名字 -->
  <h1 class="name">致 <span class="hl">小满</span></h1>
  <p class="sub">今天，世界为你亮了一盏灯</p>

  <div class="pull-hint" id="pullHint">
    <span>向下滑动，拆开这封信</span>
    <i class="arrow"></i>
  </div>
</section>

<!-- ========== 第二屏：信 ========== -->
<div class="letter-wrap" id="letterWrap">
  <article class="letter" id="letter">
    <div class="rule"></div>
    <!-- EDIT：祝你生日快乐这段随意改 -->
    <h2>亲爱的 小满：</h2>
    <p>生日快乐。这句话我在心里先说了一遍，才写下来。</p>
    <p>我不太会说漂亮话，只知道这一年你辛苦了。那些你没跟人讲的疲惫、硬撑着过去的时刻，我都看在眼里，也心疼，也佩服。</p>
    <p>新的一岁，希望你少一点「应该」，多一点「想要」。想睡觉就睡觉，想发呆就发呆，不必总做那个懂事的人。你值得被偏爱，也值得被自己偏爱。</p>
    <p>愿你往后的日子，好事都赶得上，坏天气都刚好带伞。</p>
    <!-- EDIT：落款 -->
    <div class="sign">
      一直在这儿的人
      <small>2025 · 冬</small>
    </div>
  </article>
</div>

<!-- ========== 第三屏：吹蜡烛 ========== -->
<section class="candle-stage">
  <p class="candle-title">最后，许个愿吧</p>
  <div class="cake-box" id="cakeBox" role="button" tabindex="0" aria-label="点击吹灭蜡烛">
    <div class="tier tier-1"></div>
    <div class="tier tier-2"></div>
    <div class="frost frost-1"></div>
    <div class="frost frost-2"></div>
    <div class="candle"><i class="wick"></i></div>
    <div class="flame"></div>
    <div class="smoke"></div>
  </div>
  <p class="wish" id="wish">愿你所有的愿望，都被听见</p>
  <p class="wish-tip" id="wishTip">轻触蜡烛，把它吹灭</p>
</section>

<p class="footer">MADE WITH CARE</p>

<script>
/* ================================================================
   1. 飘落花瓣 / 星光
   ================================================================ */
(function petals(){
  const cvs = document.getElementById('petals');
  const ctx = cvs.getContext('2d');
  let W, H, parts = [], dpr = Math.min(window.devicePixelRatio || 1, 2);
  const COLORS = ['#e8a598','#f0c3b6','#d98878','#f4dccf','#e6c99a'];

  function resize(){
    W = cvs.clientWidth; H = cvs.clientHeight;
    cvs.width = W * dpr; cvs.height = H * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function make(){
    return {
      x: Math.random()*W,
      y: Math.random()*-H,
      r: 3 + Math.random()*5,
      vy: .28 + Math.random()*.65,
      vx: -.25 + Math.random()*.5,
      rot: Math.random()*Math.PI*2,
      vr: (-.012 + Math.random()*.024),
      a: .28 + Math.random()*.45,
      c: COLORS[(Math.random()*COLORS.length)|0],
      petal: Math.random() > .45
    };
  }

  function fill(){
    parts = [];
    const n = Math.round(Math.min(46, Math.max(16, W*H/22000)));
    for (let i=0;i<n;i++){ const p = make(); p.y = Math.random()*H; parts.push(p); }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    for (const p of parts){
      p.y += p.vy; p.x += p.vx; p.rot += p.vr;
      if (p.y > H + 24){ Object.assign(p, make()); p.y = -20; }
      if (p.x < -30) p.x = W + 20;
      if (p.x > W + 30) p.x = -20;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = p.a;
      ctx.fillStyle = p.c;
      if (p.petal){
        // 花瓣：两段贝塞尔
        ctx.beginPath();
        ctx.moveTo(0, -p.r);
        ctx.bezierCurveTo(p.r*.95, -p.r*.55, p.r*.6, p.r*.75, 0, p.r);
        ctx.bezierCurveTo(-p.r*.6, p.r*.75, -p.r*.95, -p.r*.55, 0, -p.r);
        ctx.fill();
      } else {
        // 小圆点星光
        ctx.beginPath();
        ctx.arc(0,0,p.r*.42,0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }
    requestAnimationFrame(draw);
  }

  function init(){
    resize(); fill(); draw();
    window.addEventListener('resize', () => { resize(); fill(); });
  }
  init();
})();

/* ================================================================
   2. 滚动到信纸位置 → 卷轴拉开
   ================================================================ */
(function revealLetter(){
  const letter = document.getElementById('letter');
  const hint   = document.getElementById('pullHint');
  let done = false;

  function check(){
    if (done) return;
    const top = letter.getBoundingClientRect().top;
    const vh  = window.innerHeight;
    // 信纸上沿进入视口 78% 处即触发
    if (top < vh * 0.78){
      letter.classList.add('open');
      hint.classList.add('hide');
      done = true;
      window.removeEventListener('scroll', check);
    }
  }
  window.addEventListener('scroll', check, { passive:true });
  window.addEventListener('resize', check);

  // 用户开始滚动就隐藏下拉提示
  let hid = false;
  window.addEventListener('scroll', () => {
    if (!hid && window.scrollY > 20){ hint.classList.add('hide'); hid = true; }
  }, { passive:true });

  // 首次自动检查（有些屏幕一进来信纸已在视口）
  requestAnimationFrame(check);
})();

/* ================================================================
   3. 吹蜡烛
   ================================================================ */
(function blowCandle(){
  const box  = document.getElementById('cakeBox');
  const wish = document.getElementById('wish');
  const tip  = document.getElementById('wishTip');
  let blown = false;

  function blow(){
    if (blown) return;
    blown = true;
    document.body.classList.add('blown');
    // 火星散开的小程序：用几个瞬时圆点模拟
    setTimeout(() => {
      wish.classList.add('show');
      tip.textContent = '生日快乐，愿你得偿所愿。';
    }, 380);
    if (navigator.vibrate) navigator.vibrate([12, 60, 18]);
  }

  box.addEventListener('click', blow);
  box.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); blow(); }
  });
})();

/* ================================================================
   4. 背景音乐（WebAudio 现场合成，无需外部音频文件）
      旋律：生日快乐 —— 用三角波 + 柔和包络，听感接近音乐盒
   ================================================================ */
(function music(){
  const btn = document.getElementById('musicBtn');
  let ctx = null, playing = false, timer = null, master = null;

  // [MIDI 音高, 拍数]
  const MELODY = [
    [67,0.5],[67,0.5],[69,1],[67,1],[72,1],[71,2],
    [67,0.5],[67,0.5],[69,1],[67,1],[74,1],[72,2],
    [67,0.5],[67,0.5],[79,1],[76,1],[72,1],[74,1],[72,2],
    [77,0.5],[77,0.5],[76,1],[72,1],[74,1],[72,2]
  ];
  const BPM = 92;
  const BEAT = 60 / BPM;

  const midiToFreq = m => 440 * Math.pow(2, (m - 69) / 12);

  function ensureCtx(){
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = 0.0;
    master.connect(ctx.destination);
  }

  function bellAt(freq, t, dur, gainVal){
    // 基音 + 八度泛音，模拟音乐盒 / 铃铛
    const partials = [
      { mul:1,    g:1,    type:'triangle' },
      { mul:2,    g:0.3,  type:'sine' },
      { mul:3.01, g:0.10, type:'sine' }
    ];
    partials.forEach(p => {
      const osc = ctx.createOscillator();
      const g   = ctx.createGain();
      osc.type = p.type;
      osc.frequency.value = freq * p.mul;

      const peak = gainVal * p.g;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(peak, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.35);

      osc.connect(g).connect(master);
      osc.start(t);
      osc.stop(t + dur + 0.45);
    });
  }

  function playLoop(){
    if (!playing) return;
    let t = ctx.currentTime + 0.06;
    MELODY.forEach(([n, beats]) => {
      const dur = beats * BEAT * 0.92;
      bellAt(midiToFreq(n), t, dur, 0.16);
      // 低八度轻铺底，让旋律不单薄
      bellAt(midiToFreq(n - 12), t, dur, 0.045);
      t += beats * BEAT;
    });
    const total = MELODY.reduce((s, x) => s + x[1] * BEAT, 0);
    // 循环：末尾留 2 拍静默
    timer = setTimeout(playLoop, (total + BEAT * 2) * 1000);
  }

  function start(){
    ensureCtx();
    if (ctx.state === 'suspended') ctx.resume();
    playing = true;
    document.body.classList.add('music-on');
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(0.85, ctx.currentTime + 1.2);
    playLoop();
  }

  function stop(){
    playing = false;
    document.body.classList.remove('music-on');
    clearTimeout(timer);
    if (ctx && master){
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
      master.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.5);
    }
  }

  btn.addEventListener('click', () => { playing ? stop() : start(); });

  // 页面不可见时暂停，回来继续
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden && playing) { ctx.suspend(); }
    else if (!document.hidden && playing) { ctx.resume(); }
  });
})();
</script>
</body>
</html>
